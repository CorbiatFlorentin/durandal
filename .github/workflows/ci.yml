name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité (CS, PHPStan, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer validate --strict

      - uses: ramsey/composer-install@v4

      - run: composer audit
      - run: composer cs
      - run: composer phpstan

  tests:
    name: PHP ${{ matrix.php }} · Symfony ${{ matrix.symfony }} · ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['6.4', '7.4', '8']
        dependencies: [lowest, highest]
        exclude:
          # Symfony 8 exige PHP 8.4+
          - { php: '8.2', symfony: '8' }
          - { php: '8.3', symfony: '8' }
    env:
      WITH_COVERAGE: ${{ matrix.php == '8.4' && matrix.symfony == '7.4' && matrix.dependencies == 'highest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ env.WITH_COVERAGE == 'true' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Fixer la version de Symfony
        run: |
          if [ "${{ matrix.symfony }}" = "8" ]; then constraint="^8.0"; else constraint="~${{ matrix.symfony }}.0"; fi
          composer require --dev --no-update "symfony/http-client:${constraint}"

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Tests
        if: env.WITH_COVERAGE != 'true'
        run: vendor/bin/phpunit

      - name: Tests avec couverture
        if: env.WITH_COVERAGE == 'true'
        run: vendor/bin/phpunit --coverage-clover build/coverage.xml

      - name: Seuil de couverture (95 %)
        if: env.WITH_COVERAGE == 'true'
        run: php tools/check-coverage.php build/coverage.xml 95

      - name: Envoi de la couverture
        if: env.WITH_COVERAGE == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  mutation:
    name: Mutation (Infection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      - run: vendor/bin/infection --threads=max --show-mutations
